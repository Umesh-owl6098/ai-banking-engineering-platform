spring.application.name=banking-engineering-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/banking_platform
spring.datasource.username=banking_user
spring.datasource.password=banking_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

investigation.supervisor.aml.amount-threshold=10000.00
investigation.supervisor.aml.risk-score-threshold=75.00

fraud.high-risk-score-threshold=75.00
fraud.large-transaction-threshold=10000.00
fraud.rapid-movement-window-hours=24
fraud.rapid-movement-combined-amount-threshold=20000.00
fraud.structuring-window-days=7
fraud.structuring-reporting-threshold=10000.00
fraud.high-risk-countries=Iran,North Korea,Syria,Afghanistan
fraud.unusual-channel-minimum-history=3
fraud.unusual-channel-common-ratio=0.60
fraud.profile-mismatch-large-transaction-threshold=25000.00
fraud.profile-mismatch-new-account-days=90
fraud.flagged-transaction-score=20
fraud.high-transaction-risk-score=15
fraud.large-transaction-score=15
fraud.high-risk-country-score=15
fraud.rapid-movement-score=20
fraud.structuring-score=25
fraud.unusual-channel-score=10
fraud.customer-profile-mismatch-score=15

kyc.high-risk-countries=Iran,North Korea,Syria,Afghanistan
kyc.new-account-days=90
kyc.recent-activity-days=30
kyc.high-value-transaction-threshold=10000.00
kyc.kyc-not-verified-score=15
kyc.missing-occupation-score=10
kyc.missing-source-of-funds-score=15
kyc.pep-customer-score=20
kyc.high-customer-risk-score=15
kyc.restricted-nationality-score=15
kyc.restricted-residence-score=15
kyc.new-account-score=10
kyc.inactive-account-score=15
kyc.profile-inconsistency-score=20

aml.reporting-threshold=10000.00
aml.large-transaction-threshold=10000.00
aml.high-risk-score-threshold=75.00
aml.rapid-window-hours=24
aml.rapid-combined-threshold=20000.00
aml.new-account-days=90
aml.high-risk-countries=Iran,North Korea,Syria,Afghanistan
aml.structuring-score=25
aml.rapid-movement-score=20
aml.large-transaction-score=15
aml.high-risk-country-score=15
aml.high-risk-customer-score=15
aml.pep-activity-score=20
aml.flagged-transaction-score=20
aml.high-transaction-risk-score=15
aml.new-account-activity-score=15
aml.multiple-high-risk-indicators-score=20

compliance.multiple-high-risk-findings-score=25
compliance.fraud-critical-score=35
compliance.aml-critical-score=35
compliance.kyc-critical-score=25
compliance.fraud-and-aml-combination-score=25
compliance.pep-with-aml-score=20
compliance.high-confidence-match-score=15
compliance.multiple-escalations-score=20
compliance.consistent-high-risk-pattern-score=20
compliance.manual-review-required-score=15

investigation.evidence.max-citations-per-agent=3
investigation.evidence.minimum-relevance-score=0.250
investigation.evidence.search-limit=8
investigation.evidence.enable-hybrid-search=true

investigation.report.prompt-version=1.0.0
investigation.report.model=gpt-4.1-mini
investigation.report.temperature=0.2
investigation.report.max-retries=3
investigation.report.retry-delay-ms=500

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

info.app.name=AI Banking Investigation Platform
info.app.description=Multi-agent fraud investigation workspace

auth.demo-users.enabled=true
auth.demo-users.password=${DEMO_USER_PASSWORD:Password123!}
auth.jwt.secret=dev-only-banking-platform-jwt-secret-change-in-production-32b
auth.jwt.expiration-ms=86400000

simulation.transactions.interval-ms=3000

investigation.auto-create.default-project-id=8c0c0dee-dd8e-4419-bef3-a2e93c10a726

notification.waiting-threshold-hours=24
notification.waiting-check-interval-ms=300000
