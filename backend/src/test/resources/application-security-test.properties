spring.datasource.url=jdbc:h2:mem:security-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
auth.demo-users.enabled=false
auth.jwt.secret=security-test-jwt-secret-key-with-enough-length
auth.jwt.expiration-ms=3600000
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
